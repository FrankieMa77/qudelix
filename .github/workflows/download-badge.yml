name: Download badge

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    env:
      PREVIOUS_DOWNLOADS: 53
    steps:
      - name: Publish downloads.json to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          live=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq '[.[].assets[].download_count] | add // 0')
          total=$((live + PREVIOUS_DOWNLOADS))
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"brightgreen"}\n' "$total" > "$dir/downloads.json"
          cd "$dir"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Update download count to $total"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:badges
